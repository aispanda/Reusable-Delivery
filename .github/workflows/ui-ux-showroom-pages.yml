name: UI/UX kit showroom on GitHub Pages

# Publishes docs/ui-ux-delivery/showroom with the example CSS and assets it loads.
# Needs Pages enabled for this repository with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths:
      - docs/ui-ux-delivery/showroom/**
      - docs/ui-ux-delivery/examples/**
      - docs/ui-ux-delivery/assets/**
      - .github/workflows/ui-ux-showroom-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-ux-showroom-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}showroom/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the site
        run: |
          kit=docs/ui-ux-delivery
          mkdir -p _site/showroom
          cp -R "$kit/examples" "$kit/assets" _site/
          cp -R "$kit/showroom/index.html" "$kit/showroom/showroom.css" "$kit/showroom/showroom.js" \
                "$kit/showroom/fonts" "$kit/showroom/brand" _site/showroom/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>UI/UX delivery and testing kit</title>' \
            '<meta http-equiv="refresh" content="0; url=showroom/"><link rel="canonical" href="showroom/">' \
            '<a href="showroom/">Open the UI/UX delivery and testing kit showroom</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
